<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ff">
  <meta name="description" content="Lerne Satzglieder und hilf dem Vogel beim Fliegen.">
  <title>Satzglieder-Flug | Lernspiele</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #29233d;
      --muted: #6f6a7e;
      --purple: #7048d8;
      --purple-dark: #5431b5;
      --paper: #fff;
      --line: #e9e4f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 300px;
      min-height: 100vh;
      margin: 0;
      background: #faf9fc;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    button,
    a {
      font: inherit;
    }

    .wrap {
      width: min(760px, calc(100% - 32px));
      margin-inline: auto;
    }

    header {
      padding: 18px 0;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
    }

    .brand span {
      color: var(--purple);
    }

    .back-link {
      color: var(--purple-dark);
      font-weight: 700;
      text-decoration: none;
    }

    main {
      padding: 20px 0 42px;
    }

    .heading {
      margin-bottom: 20px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--purple);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: -0.05em;
      line-height: 1.08;
    }

    .heading p:last-child {
      margin: 0;
      color: var(--muted);
    }

    .game-card {
      padding: clamp(12px, 3vw, 22px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 16px 48px #29233d10;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 auto 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .scoreboard strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .game {
      position: relative;
      width: min(100%, 440px);
      margin-inline: auto;
      overflow: hidden;
      border: 2px solid #e8e2f5;
      border-radius: 18px;
      background: #bceaff;
      line-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      touch-action: manipulation;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #29233d80;
      line-height: 1.45;
    }

    .overlay[hidden] {
      display: none;
    }

    .dialog {
      width: min(100%, 350px);
      max-height: 100%;
      overflow: auto;
      padding: clamp(18px, 5vw, 26px);
      border: 1px solid #ffffffa8;
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 18px 55px #1c173344;
      text-align: center;
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 5vw, 1.75rem);
      line-height: 1.15;
    }

    .dialog p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .sentence {
      display: block;
      margin: 10px 0;
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 800;
    }

    .answers {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--purple);
      color: #fff;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 150ms ease, transform 150ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      background: var(--purple-dark);
    }

    .button:focus-visible,
    a:focus-visible {
      outline: 3px solid #f2b633;
      outline-offset: 3px;
    }

    .button.secondary {
      border: 1px solid var(--line);
      background: #f5f2fb;
      color: var(--ink);
    }

    .button.secondary:hover {
      background: #ebe5f8;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    #flap-button {
      min-width: min(100%, 240px);
      min-height: 52px;
    }

    .instructions {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      .wrap {
        width: min(100% - 24px, 760px);
      }

      header {
        padding: 14px 0;
      }

      main {
        padding-top: 12px;
      }

      .game-card {
        padding: 10px;
        border-radius: 18px;
      }

      .dialog {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="Index.html">Lern<span>spiele</span></a>
      <a class="back-link" href="Index.html">← Zur Startseite</a>
    </div>
  </header>

  <main class="wrap">
    <div class="heading">
      <p class="eyebrow">Spielen und lernen</p>
      <h1>Satzglieder-Flug</h1>
      <p>Weiche den Rohren aus und zeige, was du über Satzglieder weißt!</p>
    </div>

    <section class="game-card" aria-label="Satzglieder-Flug-Spiel">
      <div class="scoreboard" aria-live="polite">
        <span>Punkte: <strong id="score">0</strong></span>
        <span>Bestleistung: <strong id="best-score">0</strong></span>
      </div>
      <div class="game">
        <canvas id="game-canvas" width="360" height="540" aria-label="Spielbereich: Tippe oder klicke zum Flattern."></canvas>
        <div class="overlay" id="overlay" aria-live="polite"></div>
      </div>
      <div class="controls">
        <button class="button" id="flap-button" type="button">Spiel starten</button>
      </div>
      <p class="instructions">Tippe oder klicke ins Spielfeld oder drücke die Leertaste bzw. ↑ zum Flattern.</p>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game-canvas");
    const context = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const flapButton = document.getElementById("flap-button");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best-score");
    const world = { width: 360, height: 540, ground: 490 };
    const questions = [
      {
        sentence: "Der kleine Hund jagt den roten Ball.",
        prompt: "Was ist „Der kleine Hund“ für ein Satzglied?",
        answers: ["Subjekt", "Prädikat", "Akkusativobjekt"],
        correct: 0
      },
      {
        sentence: "Mia schenkt ihrem Bruder ein Buch.",
        prompt: "Was ist „ihrem Bruder“ für ein Satzglied?",
        answers: ["Subjekt", "Dativobjekt", "Akkusativobjekt"],
        correct: 1
      },
      {
        sentence: "Der Vogel baut ein Nest.",
        prompt: "Was ist „baut“ für ein Satzglied?",
        answers: ["Prädikat", "Subjekt", "Dativobjekt"],
        correct: 0
      },
      {
        sentence: "Am Morgen fährt Tom mit dem Bus zur Schule.",
        prompt: "Was ist „Am Morgen“ für ein Satzglied?",
        answers: ["Akkusativobjekt", "Prädikat", "Adverbiale der Zeit"],
        correct: 2
      },
      {
        sentence: "Lena liest ein spannendes Buch.",
        prompt: "Was ist „ein spannendes Buch“ für ein Satzglied?",
        answers: ["Dativobjekt", "Akkusativobjekt", "Subjekt"],
        correct: 1
      },
      {
        sentence: "Die Kinder spielen fröhlich im Garten.",
        prompt: "Was ist „im Garten“ für ein Satzglied?",
        answers: ["Adverbiale des Ortes", "Prädikat", "Dativobjekt"],
        correct: 0
      }
    ];
    const bird = { x: 92, y: 265, radius: 14, velocity: 0 };
    const pipeWidth = 58;
    let pipes = [];
    let score = 0;
    let bestScore = 0;
    let phase = "ready";
    let questionIndex = 0;
    let lastFrame = 0;
    let cloudOffset = 0;
    let currentQuestion = questions[0];

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text) element.textContent = text;
      return element;
    }

    function renderOverlay(title, description, actions, question) {
      overlay.replaceChildren();
      overlay.hidden = false;
      const dialog = makeElement("div", "dialog");
      dialog.setAttribute("role", "group");
      dialog.setAttribute("aria-label", title);
      dialog.append(makeElement("h2", "", title));

      if (description) dialog.append(makeElement("p", "", description));
      if (question) {
        dialog.append(makeElement("span", "sentence", question.sentence));
        dialog.append(makeElement("p", "", question.prompt));
        const answers = makeElement("div", "answers");
        answers.setAttribute("aria-label", "Antwortmöglichkeiten");
        question.answers.forEach((answer, index) => {
          const button = makeElement("button", "button secondary", answer);
          button.type = "button";
          button.addEventListener("click", () => checkAnswer(index));
          answers.append(button);
        });
        dialog.append(answers);
      }

      actions.forEach(action => {
        const button = makeElement("button", `button${action.secondary ? " secondary" : ""}`, action.label);
        button.type = "button";
        button.addEventListener("click", action.run);
        dialog.append(button);
      });

      overlay.append(dialog);
      const firstButton = dialog.querySelector("button");
      if (firstButton) firstButton.focus({ preventScroll: true });
    }

    function updateFlapButton() {
      flapButton.textContent = phase === "ready" ? "Spiel starten"
        : phase === "playing" ? "Flattern!"
          : phase === "gameover" ? "Nochmal spielen"
            : phase === "quiz" ? "Beantworte die Frage" : "Klicke auf Weiterfliegen";
      flapButton.disabled = phase === "quiz" || phase === "quiz-correct";
    }

    function updateScore() {
      scoreElement.textContent = String(score);
      bestElement.textContent = String(bestScore);
    }

    function startGame() {
      score = 0;
      bird.y = 265;
      bird.velocity = 0;
      pipes = [makePipe(390), makePipe(610)];
      phase = "playing";
      overlay.hidden = true;
      updateScore();
      updateFlapButton();
      flapButton.focus({ preventScroll: true });
    }

    function makePipe(x) {
      return {
        x,
        gapY: 165 + Math.random() * 185,
        gap: 168,
        counted: false
      };
    }

    function flap() {
      if (phase === "ready" || phase === "gameover") {
        startGame();
        bird.velocity = -6.8;
      } else if (phase === "playing") {
        bird.velocity = -6.8;
      }
    }

    function hitObstacle() {
      phase = "quiz";
      currentQuestion = questions[questionIndex % questions.length];
      questionIndex += 1;
      renderOverlay("Oh nein, Zusammenstoß!", "Beantworte die Frage richtig, um weiterzufliegen.", [], currentQuestion);
      updateFlapButton();
      pipes = pipes.filter(item => item.x + pipeWidth < bird.x - 90 || item.x > bird.x + 90);
    }

    function checkAnswer(answerIndex) {
      if (phase !== "quiz") return;
      if (answerIndex === currentQuestion.correct) {
        phase = "quiz-correct";
        updateFlapButton();
        renderOverlay("Richtig! Gut gemacht!", "Du hast ein Leben gerettet. Bereit für die nächste Runde?", [
          { label: "Weiterfliegen", run: continueGame }
        ]);
        return;
      }

      window.location.href = "index.html";
    }

    function continueGame() {
      bird.y = 265;
      bird.velocity = -3;
      phase = "playing";
      overlay.hidden = true;
      updateFlapButton();
      flapButton.focus({ preventScroll: true });
    }

    function endRun() {
      if (phase !== "playing") return;
      hitObstacle();
    }

    function updateGame(step) {
      bird.velocity += 0.38 * step;
      bird.y += bird.velocity * step;
      cloudOffset = (cloudOffset + 0.25 * step) % world.width;

      const speed = 2.5 + Math.min(score * 0.045, 1.3);
      for (const pipe of pipes) {
        pipe.x -= speed * step;
        if (!pipe.counted && pipe.x + pipeWidth < bird.x) {
          pipe.counted = true;
          score += 1;
          bestScore = Math.max(bestScore, score);
          updateScore();
        }

        const overlapsBird = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipeWidth;
        const outsideGap = bird.y - bird.radius < pipe.gapY - pipe.gap / 2
          || bird.y + bird.radius > pipe.gapY + pipe.gap / 2;
        if (overlapsBird && outsideGap) {
          endRun();
          return;
        }
      }

      pipes = pipes.filter(pipe => pipe.x + pipeWidth > -10);
      if (pipes.length === 0 || pipes[pipes.length - 1].x < 205) {
        pipes.push(makePipe(world.width + 20));
      }

      if (bird.y - bird.radius < 0 || bird.y + bird.radius > world.ground) {
        endRun();
      }
    }

    function drawCloud(x, y, scale) {
      context.fillStyle = "#ffffffb8";
      context.beginPath();
      context.arc(x, y, 15 * scale, 0, Math.PI * 2);
      context.arc(x + 18 * scale, y - 8 * scale, 20 * scale, 0, Math.PI * 2);
      context.arc(x + 39 * scale, y, 14 * scale, 0, Math.PI * 2);
      context.fill();
    }

    function drawPipe(pipe) {
      const gapTop = pipe.gapY - pipe.gap / 2;
      const gapBottom = pipe.gapY + pipe.gap / 2;
      context.fillStyle = "#45b96d";
      context.strokeStyle = "#27884b";
      context.lineWidth = 3;
      context.fillRect(pipe.x, 0, pipeWidth, gapTop - 14);
      context.strokeRect(pipe.x, -2, pipeWidth, gapTop - 12);
      context.fillRect(pipe.x - 5, gapTop - 14, pipeWidth + 10, 14);
      context.strokeRect(pipe.x - 5, gapTop - 14, pipeWidth + 10, 14);
      context.fillRect(pipe.x, gapBottom + 14, pipeWidth, world.ground - gapBottom - 14);
      context.strokeRect(pipe.x, gapBottom + 14, pipeWidth, world.ground - gapBottom - 12);
      context.fillRect(pipe.x - 5, gapBottom, pipeWidth + 10, 14);
      context.strokeRect(pipe.x - 5, gapBottom, pipeWidth + 10, 14);
    }

    function drawBird() {
      context.save();
      context.translate(bird.x, bird.y);
      context.rotate(Math.max(-0.3, Math.min(0.65, bird.velocity * 0.045)));
      context.fillStyle = "#ffd44f";
      context.strokeStyle = "#d99b24";
      context.lineWidth = 2;
      context.beginPath();
      context.ellipse(0, 0, bird.radius + 1, bird.radius, 0, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.fillStyle = "#fff";
      context.beginPath();
      context.arc(6, -5, 5, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = "#29233d";
      context.beginPath();
      context.arc(8, -5, 2, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = "#ff8b45";
      context.beginPath();
      context.moveTo(11, 1);
      context.lineTo(22, 4);
      context.lineTo(11, 7);
      context.closePath();
      context.fill();
      context.restore();
    }

    function drawGame() {
      context.clearRect(0, 0, world.width, world.height);
      const sky = context.createLinearGradient(0, 0, 0, world.ground);
      sky.addColorStop(0, "#9edfff");
      sky.addColorStop(1, "#e4f8ff");
      context.fillStyle = sky;
      context.fillRect(0, 0, world.width, world.ground);

      drawCloud(50 - cloudOffset, 80, 0.85);
      drawCloud(235 - cloudOffset, 155, 0.7);
      drawCloud(380 - cloudOffset, 65, 0.9);
      pipes.forEach(drawPipe);
      context.fillStyle = "#8bcf78";
      context.fillRect(0, world.ground, world.width, world.height - world.ground);
      context.fillStyle = "#65ad55";
      context.fillRect(0, world.ground, world.width, 9);
      context.fillStyle = "#d9c89b";
      context.fillRect(0, world.ground + 9, world.width, world.height - world.ground - 9);
      drawBird();
    }

    function frame(timestamp) {
      const step = lastFrame ? Math.min((timestamp - lastFrame) / 16.67, 2) : 1;
      lastFrame = timestamp;
      if (phase === "playing") updateGame(step);
      drawGame();
      window.requestAnimationFrame(frame);
    }

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      flap();
    });
    flapButton.addEventListener("click", flap);
    window.addEventListener("keydown", event => {
      const isFocusedControl = event.target instanceof Element && event.target.closest("button, a");
      const isUp = event.code === "ArrowUp";
      const isSpace = event.code === "Space" && !isFocusedControl;
      if ((isSpace || isUp) && !event.repeat) {
        event.preventDefault();
        flap();
      }
    });

    bestElement.textContent = String(bestScore);
    renderOverlay("Bereit zum Fliegen?", "Bei einem Zusammenstoß kommt eine Satzgliederfrage. Richtig beantwortet? Dann geht es weiter!", [
      { label: "Spiel starten", run: startGame }
    ]);
    updateFlapButton();
    window.requestAnimationFrame(frame);
  </script>
</body>
</html>
