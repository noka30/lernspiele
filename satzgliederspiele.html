<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satzglieder-Spiele</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #3498db;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    header h1 {
      font-size: 1.5rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      flex: 1;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
    }

    .title-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .game-card.disabled {
      opacity: 0.6;
      background-color: #f0f0f0;
    }

    .game-card h3 {
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }

    .game-card p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background-color: #2ecc71;
      color: white;
      padding: 0.75rem 1rem;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #27ae60;
    }

    .btn-disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Satzglieder-Spiele</h1>
    <nav>
      <a href="index.html">← Zurück zur Startseite</a>
    </nav>
  </header>

  <main>
    <section class="title-section">
      <h2>Wähle ein Spiel aus</h2>
      <p>Trainiere dein Wissen über Subjekt, Prädikat und Objekte!</p>
    </section>

    <section class="games-grid">
      <!-- 1. Spiel: Satzglieder Flappy -->
      <div class="game-card">
        <div>
          <h3>Satzglieder Flappy</h3>
          <p>Fliege durch die Hindernisse und beantworte Fragen zu den Satzgliedern.</p>
        </div>
        <a href="satzgliederflappy.html" class="btn">Jetzt spielen</a>
      </div>

      <!-- Platzhalter für zukünftige Spiele -->
      <div class="game-card disabled">
        <div>
          <h3>Spiel 2</h3>
          <p>Demnächst verfügbar...</p>
        </div>
        <span class="btn btn-disabled">Bald verfügbar</span>
      </div>
    </section>
  </main>

</body>
</html>
