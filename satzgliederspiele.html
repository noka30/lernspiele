<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernspiele</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Oben: Navigationsleiste */
    header {
      background-color: #3498db;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    header h1 {
      font-size: 1.5rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Hauptinhalt */
    main {
      flex: 1;
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1rem;
      text-align: center;
    }

    .card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      margin-bottom: 1rem;
      color: #2c3e50;
    }

    .card p {
      margin-bottom: 1.5rem;
      color: #666;
    }

    /* Unten: Link/Button zur Unterseite */
    .btn {
      display: inline-block;
      background-color: #2ecc71;
      color: white;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <!-- Oben: Navigationsleiste -->
  <header>
    <h1>Lernspiele</h1>
    <nav>
      <a href="satzgliederspiele.html">Satzglieder</a>
    </nav>
  </header>

  <!-- Hauptbereich -->
  <main>
    <div class="card">
      <h2>Willkommen!</h2>
      <p>Hier findest du Übungen und Spiele für die Klasse.</p>
      
      <!-- Unten: Link zu satzgliederspiele.html -->
      <a href="satzgliederspiele.html" class="btn">Zu den Satzglieder-Spielen</a>
    </div>
  </main>

</body>
</html>
